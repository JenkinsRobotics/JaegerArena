name: Arena checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site and documentation
        run: python3 scripts/check_site.py
      - name: Check browser script syntax
        run: |
          node --check docs/assets/site.js
          node --check jaeger_arena/web/app.js
      - name: Check patch whitespace
        run: git show --format= --check HEAD
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock -r requirements-build.txt
      - run: python -m build --no-isolation
      - run: python scripts/check_release.py
      - name: Install wheel and exercise human and MCP onboarding outside checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: jaeger-arena-0.1.0
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment recipe
        run: ARENA_DOMAIN=arena.example.com docker compose config --quiet
      - name: Build and exercise packaged server
        run: |
          docker build -t jaeger-arena:check .
          docker run --rm --read-only --tmpfs /tmp -v "$PWD/scripts:/checks:ro" jaeger-arena:check python /checks/smoke_installed.py
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e ARENA_DOMAIN=arena.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile
