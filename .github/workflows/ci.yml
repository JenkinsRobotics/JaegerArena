name: Documentation and site

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site and documentation
        run: python3 scripts/check_site.py
      - name: Check browser script syntax
        run: node --check docs/assets/site.js
      - name: Check patch whitespace
        run: git show --format= --check HEAD
